<tr id="row-{{ values.id.unwrap() }}">
    <td colspan="10">
        {% if error != "" %}<p role="alert">{{ error }}</p>{% endif %}
        <form
                data-model-mutation
                hx-put="/models/{{ values.id.unwrap() }}"
                hx-target="#row-{{ values.id.unwrap() }}"
                hx-swap="outerHTML">
            {% include "_model_fields.html" %}

            <div style="margin-top:.5rem;display:flex;gap:.5rem;">
                <button type="submit">Save</button>
                <button type="button"
                        hx-get="/models/{{ values.id.unwrap() }}/row"
                        hx-target="#row-{{ values.id.unwrap() }}"
                        hx-swap="outerHTML">Cancel</button>
            </div>
        </form>
    </td>
</tr>
