<div class="model-fields">
    <label>Name
        <input type="text" name="name" value="{{ values.name }}" required
               aria-invalid="{% if field_errors.name != "" %}true{% else %}false{% endif %}"
               {% if field_errors.name != "" %}aria-describedby="{{ field_prefix }}-name-error"{% endif %}>
        {% if field_errors.name != "" %}<span class="field-error" id="{{ field_prefix }}-name-error" role="alert">{{ field_errors.name }}</span>{% endif %}
    </label>
    <label>Short
        <input type="text" name="name_short" value="{{ values.name_short }}" required
               aria-invalid="{% if field_errors.name_short != "" %}true{% else %}false{% endif %}"
               {% if field_errors.name_short != "" %}aria-describedby="{{ field_prefix }}-name-short-error"{% endif %}>
        {% if field_errors.name_short != "" %}<span class="field-error" id="{{ field_prefix }}-name-short-error" role="alert">{{ field_errors.name_short }}</span>{% endif %}
    </label>
    <label>Score <input type="number" name="score" value="{{ values.score }}"></label>
    <label>Score short <input type="number" name="score_short" value="{{ values.score_short }}"></label>
    <label>#Times
        <input type="number" name="num_of_times" value="{{ values.num_of_times }}" min="0" required
               aria-invalid="{% if field_errors.num_of_times != "" %}true{% else %}false{% endif %}"
               {% if field_errors.num_of_times != "" %}aria-describedby="{{ field_prefix }}-times-error"{% endif %}>
        {% if field_errors.num_of_times != "" %}<span class="field-error" id="{{ field_prefix }}-times-error" role="alert">{{ field_errors.num_of_times }}</span>{% endif %}
    </label>
    <label>#Times short
        <input type="number" name="num_of_times_short" value="{{ values.num_of_times_short }}" min="0" required
               aria-invalid="{% if field_errors.num_of_times_short != "" %}true{% else %}false{% endif %}"
               {% if field_errors.num_of_times_short != "" %}aria-describedby="{{ field_prefix }}-times-short-error"{% endif %}>
        {% if field_errors.num_of_times_short != "" %}<span class="field-error" id="{{ field_prefix }}-times-short-error" role="alert">{{ field_errors.num_of_times_short }}</span>{% endif %}
    </label>
    <label>Image filename <input type="text" name="image_name" value="{{ values.image_name }}"></label>
    <label>Long video (Dropbox link or /static/video/file.mp4)
        <input type="text" name="long_url" value="{{ values.long_url }}" placeholder="https://www.dropbox.com/…&dl=0" required
               aria-invalid="{% if field_errors.long_url != "" %}true{% else %}false{% endif %}"
               {% if field_errors.long_url != "" %}aria-describedby="{{ field_prefix }}-long-url-error"{% endif %}>
        {% if field_errors.long_url != "" %}<span class="field-error" id="{{ field_prefix }}-long-url-error" role="alert">{{ field_errors.long_url }}</span>{% endif %}
    </label>
    <label>Short video (Dropbox link or /static/video/file.mp4)
        <input type="text" name="short_url" value="{{ values.short_url }}" placeholder="https://www.dropbox.com/…&dl=0" required
               aria-invalid="{% if field_errors.short_url != "" %}true{% else %}false{% endif %}"
               {% if field_errors.short_url != "" %}aria-describedby="{{ field_prefix }}-short-url-error"{% endif %}>
        {% if field_errors.short_url != "" %}<span class="field-error" id="{{ field_prefix }}-short-url-error" role="alert">{{ field_errors.short_url }}</span>{% endif %}
    </label>
</div>

<label>Description<br>
    <textarea name="description" rows="3">{{ values.description }}</textarea>
</label>
<label>Comments<br>
    <textarea name="comments" rows="2">{{ values.comments }}</textarea>
</label>
